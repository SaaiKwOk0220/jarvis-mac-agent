name: swift-test

on:
  pull_request:
    branches: [main, fix/loopback-security-main, feat/safari-read-stacked]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            project info/02_planned/jarvis/app/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project info/02_planned/jarvis/app/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run swift test
        run: swift test --package-path 'project info/02_planned/jarvis/app'

      - name: Test Safari read experiment
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/safari-read-session-control' && github.base_ref == 'feat/safari-read-stacked'
        run: >-
          swift test --package-path 'project info/02_planned/jarvis/app'
          --scratch-path "$RUNNER_TEMP/jarvis-safari-read-build"
          -Xswiftc -DJARVIS_SAFARI_EXPERIMENT_BUILD
